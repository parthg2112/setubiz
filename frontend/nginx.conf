server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The advisory response is ~130 KB raw; rural links need it compressed.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # Same-origin API, so the browser never needs CORS and the demo works with no network.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    # The service worker must revalidate on every load or updates never reach clients.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
